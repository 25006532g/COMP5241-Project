const RAW=[[["What does project scope define?", "Included and excluded work", "Only the language", "All possible future features", "Only screen colors", "Scope sets the agreed boundaries of the project."], ["Why plan a software project?", "Coordinate goals, resources, and schedule", "Eliminate testing", "Avoid stakeholders", "Deploy all ideas immediately", "Planning organizes work within goals and constraints."], ["A supplier may deliver late. What next?", "Assess risk and plan a response", "Hide it", "Assume delays are impossible", "Stop communication", "Risk management considers likelihood, impact, and responses."], ["What does feasibility examine?", "Viability under constraints", "Only code syntax", "Only screen colors", "Only staff names", "Feasibility considers technical, financial, and operational viability."], ["A new feature threatens a deadline. What next?", "Assess impact and agree priorities", "Add it silently", "Remove all testing", "Ignore every request", "Changes need assessment and stakeholder agreement."], ["What describes iterative planning?", "Revisit plans as feedback emerges", "No planning", "Every detail stays fixed", "No user feedback", "Iterative planning adapts to evidence and changing knowledge."]], [["Which activity clarifies user needs?", "Requirements analysis", "Compilation", "Deployment", "System retirement", "Requirements analysis identifies needs and constraints."], ["Which is a functional requirement?", "Users can reset passwords", "A response-time target", "An availability target", "An encryption standard", "Functional requirements specify capabilities and behavior."], ["Which is a measurable performance requirement?", "Search returns within two seconds at a defined load", "The app feels fast", "Add a search button", "Users can rename profiles", "Performance targets should specify measurable conditions."], ["Stakeholders request conflicting workflows. What next?", "Clarify needs and negotiate priorities", "Build both blindly", "Igno const Q=RAW.flatMap((rows,d)=>rows.map((a,i)=>({id:`${d}-${i}`,d,text:a[0],options:a.slice(1,5),why:a[5],difficulty:i<2?'Beginner':i<4?'Intermediate':'Advanced'})));
function fresh(){return {v:1,level:1,xp:0,credits:0,done:[],items:[],weapon:null,armor:null,history:[],battle:null,selected:0,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches}}
function valid(a){if(!a||a.v!==1||!Number.isInteger(a.level)||a.level<1||!Number.isFinite(a.xp)||a.xp<0||!Number.isFinite(a.credits)||a.credits<0||!Number.isInteger(a.selected)||a.selected<0||a.selected>=6)return false;if(!Array.isArray(a.done)||!Array.isArray(a.items)||!Array.isArray(a.history))return false;if(a.done.some(id=>!/^([0-5])-([0-3])$/.test(id)))return false;if(a.items.some(i=>!i||typeof i.id!=='string'||typeof i.name!=='string'||!['weapon','armor'].includes(i.slot)||!Number.isFinite(i.bonus)||i.bonus<0))return false;if(a.history.some(h=>!Q.some(q=>q.id===h.id)||typeof h.ok!=='boolean'))return false;for(const slot of ['weapon','armor'])if(a[slot]!=null&&!a.items.some(i=>i.id===a[slot]&&i.slot===slot))return false;let b=a.battle;if(!b)return true;return Number.isInteger(b.d)&&b.d>=0&&b.d<6&&Number.isInteger(b.e)&&b.e>=0&&b.e<4&&['playing','victory','defeat'].includes(b.status)&&['hp','enemy','max','attack','def','turn','combo'].every(k=>Number.isFinite(b[k])&&b[k]>=0)&&b.max>0&&Q.some(q=>q.id===b.q)&&Array.isArray(b.order)&&b.order.length===4&&[0,1,2,3].every(n=>b.order.includes(n))&&Array.isArray(b.used)&&Array.isArray(b.log)&&(b.status!=='victory'||b.reward&&Number.isFinite(b.reward.xp)&&Number.isFinite(b.reward.credits))}
let S=fresh(),memoryOnly=false,loadWarning='',rawSave=null;try{rawSave=localStorage.getItem(KEY);if(rawSave){let x=JSON.parse(rawSave);if(valid(x))S=x;else loadWarning='The previous save is incompatible. It has not been overwritten. Export its raw backup from Save & recovery.'}}catch(e){memoryOnly=true;loadWarning='Local save could not be loaded. Use Export save before closing.'}
let protectOld=!!rawSave&&!!loadWarning,tab=S.battle?'battle':'map',selected=S.selected,hero={x:D[selected][2],y:D[selected][3]},route=[],scene=null,hover=-1,last=0,fxUntil=0,lastError='',notice=loadWarning,downloadURL=null;
function save(){if(protectOld){storageUI();return}try{localStorage.setItem(KEY,JSON.stringify(S));memoryOnly=false}catch(e){memoryOnly=true}storageUI()}
function storageUI(){$('#storage').textContent=protectOld?'Previous save protected: export a backup before choosing a new game.':memoryOnly?'Session-only mode — storage is blocked. Export a save before closing or refreshing.':'Local save enabled · Portable backups available in Save & recovery.'}
function st(){return {hp:100+10*(S.level-1),atk:20+2*(S.level-1)+(S.items.find(i=>i.id===S.weapon)?.bonus||0),def:5+S.level-1+(S.items.find(i=>i.id===S.armor)?.bonus||0)}}function unlocked(d){return d===0||S.done.includes(`${d-1}-3`)}function allowed(d,e){return unlocked(d)&&(e===0||S.done.includes(`${d}-${e-1}`))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function modal(title,message,actions){let m=$('#modal');m.replaceChildren();let h=document.createElement('h2');h.textContent=title;let p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.textContent=message;let row=document.createElement('div');row.className='row';for(const [label,fn]of actions){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.close();if(fn)fn()};row.append(b)}m.append(h,p,row);if(!m.open)m.showModal()}
function exportText(name,text){if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(new Blob([text],{type:'application/json'}));let a=document.createElement('a');a.href=downloadURL;a.download=name;document.body.append(a);a.click();a.remove()}
function backup(){exportText('neon-requiem-save.json',JSON.stringify({format:'neon-requiem-backup-v1',state:S},null,2))}
function recovery(){modal('Save & recovery',(memoryOnly?'Storage is blocked: progress is held in this page. Export before refreshing.':'Local saving is available.')+'\n\nLast graphics error:\n'+(lastError||'None captured.'),[['Close'],['Export save',backup],['Import save',()=>$('#import').click()],['Redraw scene',()=>{lastError='';notice='';render()}],['Export diagnostics',()=>exportText('neon-requiem-diagnostics.json',JSON.stringify({error:lastError,screen:tab,battle:S.battle?{district:S.battle.d,encounter:S.battle.e,status:S.battle.status}:null,memoryOnly,userAgent:navigator.userAgent},null,2))],...(rawSave?[['Export previous raw save',()=>exportText('neon-requiem-previous-save.json',rawSave)]]:[])])}
$('#import').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let raw=JSON.parse(await f.text()),x=raw.state||raw;if(!valid(x))throw new Error('Incompatible save file.');modal('Import save?','This replaces current progress. Export your current save first if needed.',[['Cancel'],['Import',()=>{S=x;protectOld=false;selected=S.selected;hero={x:D[selected][2],y:D[selected][3]};route=[];tab=S.battle?'battle':'map';notice='';save();render()}]])}catch(err){modal('Import failed',err.message,[['Close']])}finally{e.target.value=''}};
function newQuestion(b){let pool=Q.filter(q=>q.d===b.d);if(b.e===3&&b.turn%3===2)pool=Q.filter(q=>q.d<=b.d);let unused=pool.filter(q=>!b.used.includes(q.id));b.q=shuffle(unused.length?unused:pool)[0].id;b.order=shuffle([0,1,2,3]);b.feedback=null}
function start(d,e){if(S.battle){notice='Finish or retreat from the active encounter first.';tab='battle';render();return}if(!allowed(d,e))return;let hp=e===3?110+d*22:50+d*14+e*10;S.battle={id:Date.now(),d,e,hp:st().hp,enemy:hp,max:hp,attack:12+d*2+e,def:d*2+(e===3?3:0),turn:0,combo:0,used:[],status:'playing',log:['Encounter started.']};newQuestion(S.battle);tab='battle';notice='';save();render()}
function answer(id){let b=S.battle;if(!b||b.status!=='playing'||b.feedback)return;let q=Q.find(q=>q.id===b.q),ok=id===0;b.used.push(q.id);b.turn++;b.combo=ok?b.combo+1:0;let boost=ok&&b.combo%3===0,hit=ok?Math.max(1,st().atk-b.def):0;if(boost)hit=Math.round(hit*1.5);b.enemy=Math.max(0,b.enemy-hit);let damage=b.enemy?Math.max(1,b.attack-st().def):0;b.hp=Math.max(0,b.hp-damage);b.feedback={ok,id,hit,damage,boost};S.history.push({id:q.id,ok,time:Date.now()});b.log.unshift(`${ok?(boost?'Combo! ':'')+'Hero dealt '+hit:'Attack failed'}; enemy dealt ${damage}.`);b.log=b.log.slice(0,6);if(b.enemy===0)win(b);else if(b.hp===0)b.status='defeat';fxUntil=performance.now()+850;save();render()}
function win(b){b.status='victory';let first=!S.done.includes(`${b.d}-${b.e}`),xp=first?60+b.d*20+b.e*15:20,credits=first?30+b.d*10:8,levels=0;S.xp+=xp;S.credits+=credits;while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;levels++}if(first)S.done.push(`${b.d}-${b.e}`);let item=null;if(first&&(b.e===1||b.e===3)){let slot=b.e===3?'weapon':'armor';item={id:`${b.d}-${b.e}`,slot,bonus:(b.d+1)*(slot==='weapon'?5:2),name:slot==='weapon'?['Neon Saber','Archive Lance','Grid Splitter','Kernel Breaker','Sentinel Blade','Nexus Liberator'][b.d]:['Firewall Vest','Archive Shell','Grid Guard','Foundry Plating','Regression Ward','Guardian Exoshell'][b.d]};S.items.push(item)}b.reward={xp,credits,levels,item};b.hp=st().hp}
function finish(){S.battle=null;tab='map';notice='';save();render()}
function render(){scene=null;let s=st(),b=S.battle;$('#hud').innerHTML=`<div><span class="tag">SYSTEM GUARDIAN</span><br>LV ${S.level} · ATK ${s.atk} / DEF ${s.def}</div><div>HP ${b?b.hp:s.hp}/${s.hp}<div class="bar"><i style="width:${100*(b?b.hp:s.hp)/s.hp}%"></i></div></div><div>XP ${S.xp}/${S.level*100}<div class="bar xp"><i style="width:${S.xp/S.level}%"></i></div></div><div>${S.credits} credits<br><small>${S.done.filter(x=>x.endsWith('-3')).length}/6 cores online</small></div>`;$('#motion').checked=S.reduced;$('#notice').textContent=notice;storageUI();document.querySelectorAll('[data-tab]').forEach(el=>el.setAttribute('aria-current',el.dataset.tab===tab));if(tab==='map')mapUI();if(tab==='battle')battleUI();if(tab==='gear')gearUI();if(tab==='journal')journalUI()}
function setupScene(kind){let c=$('#world');scene={canvas:c,ctx:c.getContext('2d'),kind};scene.ctx.imageSmoothingEnabled=false}
function mapUI(){$('#app').innerHTML=`<div class="grid"><section><div class="scene"><canvas id="world" width="1024" height="640" tabindex="0" role="img" aria-label="Interactive pixel city: use arrows and Enter or the district dropdown"></canvas><div class="overlay"><span>NEON BASTION · WORLD MAP</span><span>SELECT A LANDMARK</span></div></div><label for="districts">District selection</label><select id="districts">${D.map((n,i)=>`<option value="${i}" ${selected===i?'selected':''}>${n[0]} · ${unlocked(i)?'Available':'Locked'}</option>`).join('')}</select></section><aside class="panel" id="location"></aside></div>`;setupScene('map');$('#districts').onchange=e=>choose(Number(e.target.value));let c=scene.canvas;c.onclick=e=>{let i=hit(e,c);if(i>=0)choose(i)};c.onpointermove=e=>{hover=hit(e,c);c.style.cursor=hover<0?'default':'pointer'};c.onpointerleave=()=>hover=-1;c.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();selected=(selected+(['ArrowLeft','ArrowUp'].includes(e.key)?5:1))%6;S.selected=selected;$('#districts').value=selected;locationUI();save()}if(e.key==='Enter'){e.preventDefault();choose(selected)}};locationUI()}
function locationUI(){let n=D[selected];$('#location').innerHTML=`<span class="tag">DISTRICT 0${selected+1} · ${S.done.includes(`${selected}-3`)?'RESTORED':unlocked(selected)?'AVAILABLE':'LOCKED'}</span><h2>${n[0]}</h2><p>${n[1]}</p><p class="hint">${unlocked(selected)?'Complete three patrols and a boss. Correct answers power your attacks.':'Restore the previous district to enter.'}</p><div class="missions">${[0,1,2,3].map(e=>`<button data-mission="${e}" ${!allowed(selected,e)?'disabled':''}>${S.done.includes(`${selected}-${e}`)?'✓ ':''}${e===3?'BOSS · '+n[6]:'Patrol '+(e+1)+' · '+EN[selected][e]}</button>`).join('')}</div>${S.done.filter(x=>x.endsWith('-3')).length===6?'<div class="feedback">NEON BASTION RESTORED</div>':''}`;document.querySelectorAll('[data-mission]').forEach(el=>el.onclick=()=>start(selected,Number(el.dataset.mission)))}
const paths=[[[170,470],[270,470],[270,492],[410,492],[410,450]],[[410,450],[520,450],[520,497],[670,497],[670,450]],[[670,450],[840,450],[840,300]],[[840,300],[840,350],[720,350],[720,280],[585,280],[585,237]],[[585,237],[490,237],[490,266],[315,266],[315,207]]];
